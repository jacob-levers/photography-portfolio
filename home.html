<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Homepage of Jacob Levers, showcasing featured photography work and insights.">
    <title>Home | Jacob Levers</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="scrollable-page">
    <header class="main-header">
        <nav class="main-nav">
            <a href="home.html" class="nav-logo active">JACOB LEVERS</a>
            <ul>
                <li><a href="about.html">about</a></li>
                <li><a href="work.html">work</a></li>
                <li><a href="contact.html">contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about-summary-home" class="page-section" data-nav-theme="light">
            <div class="container">
                <h2>hi, i'm jacob.</h2>
                <p>I am passionate about capturing the unique beauty of diverse subjects - from landscapes to portraits - using the power of a single image to tell stories and evoke emotions.</p>
            </div>
        </section>

        <section id="featured-photos-home" class="page-section" data-nav-theme="dark">
            <div class="container">
                </div>
        </section>

        <section id="contact-home" class="page-section" data-nav-theme="light">
            <div class="container">
                <h2>drop me a line</h2>
                <form class="contact-form" action="https://formsubmit.co/hello@jacoblevers.com" method="POST">
                    <input type="hidden" name="_next" value="https://jacoblevers.com/thanks.html">
                    <input type="hidden" name="_captcha" value="false">

                    <div class="form-group">
                        <label for="home-name">Name</label>
                        <input type="text" id="home-name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="home-email">Email</label>
                        <input type="email" id="home-email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="home-message">Message</label>
                        <textarea id="home-message" name="message" rows="6" required></textarea>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn">send message</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
    <script src="js/script.js" defer></script>
</body>
</html>
